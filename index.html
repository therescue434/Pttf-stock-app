<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการสต็อกวัสดุ-อุปกรณ์ | มูลนิธิป่อเต็กตึ๊ง</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Sarabun) -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="min-h-screen pb-10">

    <!-- Header / Navbar -->
    <header class="bg-red-700 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-white p-2 rounded-lg text-red-700 font-bold text-xl shadow">
                    <i class="fa-solid fa-boxes-stacked"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">ระบบจัดการสต็อกวัสดุ-อุปกรณ์</h1>
                    <p class="text-xs text-red-100">มูลนิธิป่อเต็กตึ๊ง / คลังอุปกรณ์ประกอบอาหาร</p>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 mt-4 space-y-4">

        <!-- Action Buttons -->
        <div class="flex items-center justify-center space-x-3">
            <button onclick="openActionModal('in')" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 px-4 rounded-xl shadow flex items-center justify-center space-x-2 transition">
                <i class="fa-solid fa-circle-plus"></i>
                <span>รับเข้า</span>
            </button>
            <button onclick="openActionModal('out')" class="flex-1 bg-amber-500 hover:bg-amber-600 text-white font-medium py-2.5 px-4 rounded-xl shadow flex items-center justify-center space-x-2 transition">
                <i class="fa-solid fa-circle-minus"></i>
                <span>เบิกออก</span>
            </button>
            <button onclick="exportLogs()" class="bg-slate-700 hover:bg-slate-800 text-white font-medium py-2.5 px-4 rounded-xl shadow flex items-center justify-center space-x-2 transition">
                <i class="fa-solid fa-file-export"></i>
                <span>Export</span>
            </button>
        </div>

        <!-- Inventory List Card -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 space-y-3">
            <div class="flex items-center justify-between">
                <h2 class="text-base font-bold text-gray-800 flex items-center space-x-2">
                    <i class="fa-solid fa-warehouse text-red-600"></i>
                    <span>รายการวัสดุ-อุปกรณ์คงคลัง</span>
                </h2>
                <button onclick="addNewItemPrompt()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-3 py-1.5 rounded-lg shadow transition">
                    + เพิ่มรายการ
                </button>
            </div>

            <!-- คอนเทนเนอร์แสดงรายการสินค้าคงคลัง -->
            <div class="divide-y divide-gray-100" id="inventoryListContainer">
                <!-- รายการจะถูกวาดจาก JavaScript -->
            </div>
        </div>

        <!-- Inventory Log Section -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 space-y-3">
            <div class="flex items-center justify-between">
                <h2 class="text-base font-bold text-gray-800 flex items-center space-x-2">
                    <i class="fa-solid fa-scroll text-amber-600"></i>
                    <span>ประวัติการรับเข้า - เบิกออก (Inventory Log)</span>
                </h2>
                <button onclick="clearAppLogs()" class="bg-red-500 hover:bg-red-600 text-white text-xs font-semibold px-3 py-1.5 rounded-lg shadow transition">
                    ล้างประวัติทั้งหมด
                </button>
            </div>

            <!-- Table Responsive -->
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-xs md:text-sm" id="logTable">
                    <thead>
                        <tr class="bg-gray-50 text-gray-600 font-bold border-b border-gray-200">
                            <th class="p-2.5">วัน-เวลา</th>
                            <th class="p-2.5">ชื่อรายการ / หมายเหตุ</th>
                            <th class="p-2.5">ประเภท</th>
                            <th class="p-2.5 text-center">จำนวน</th>
                            <th class="p-2.5">พิกัด / คงเหลือ</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-100 text-gray-700" id="logTableBody">
                        <tr id="noLogMsg">
                            <td colspan="5" class="p-6 text-center text-gray-400">
                                ยังไม่มีประวัติการทำรายการ
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- JavaScript บันทึกและดึงข้อมูล List + Log จาก LocalStorage -->
    <script>
        // ข้อมูลสินค้าเริ่มต้น (กรณีเปิดใช้งานครั้งแรก)
        var defaultInventory = [
            { id: 1, name: "เตาเคลื่อนที่ ( ปป )", unit: "เตา", inQty: 0, outQty: 0, total: 2 },
            { id: 2, name: "เทส", unit: "หน่วย", inQty: 100, outQty: 0, total: 100 }
        ];

        // เมื่อโหลดหน้าเว็บเสร็จ
        document.addEventListener("DOMContentLoaded", function() {
            renderInventoryList();
            
            // ดึงข้อมูล Log เก่ามาแสดง
            var savedLogs = localStorage.getItem("app_gps_logs");
            if (savedLogs) {
                displayLogsToTable(savedLogs);
            }
        });

        // 1. ฟังก์ชันจัดการรายการสินค้าคงคลัง (Inventory List)
        function getInventoryData() {
            var savedData = localStorage.getItem("app_inventory_items");
            if (savedData) {
                return JSON.parse(savedData);
            } else {
                localStorage.setItem("app_inventory_items", JSON.stringify(defaultInventory));
                return defaultInventory;
            }
        }

        function renderInventoryList() {
            var items = getInventoryData();
            var container = document.getElementById("inventoryListContainer");
            if (!container) return;

            container.innerHTML = "";

            if (items.length === 0) {
                container.innerHTML = '<div class="py-4 text-center text-gray-400 text-sm">ไม่มีรายการสินค้า</div>';
                return;
            }

            items.forEach(function(item) {
                var itemDiv = document.createElement("div");
                itemDiv.className = "py-3 flex items-center justify-between";
                
                var badgeClass = item.total > 0 ? "bg-amber-100 text-amber-800" : "bg-gray-100 text-gray-600";
                if(item.total >= 100) badgeClass = "bg-emerald-100 text-emerald-800";

                itemDiv.innerHTML = `
                    <div>
                        <div class="font-bold text-gray-800">${item.name}</div>
                        <div class="text-xs text-gray-500">หน่วย: ${item.unit}</div>
                    </div>
                    <div class="flex items-center space-x-4 text-sm">
                        <span class="text-emerald-600 font-semibold">${item.inQty}</span>
                        <span class="text-amber-600 font-semibold">${item.outQty}</span>
                        <span class="${badgeClass} font-bold px-3 py-1 rounded-full">${item.total} ${item.unit}</span>
                    </div>
                `;
                container.appendChild(itemDiv);
            });
        }

        function addNewItemPrompt() {
            var name = prompt("พิมพ์ชื่อรายการใหม่:");
            if (!name || name.trim() === "") return;
            var unit = prompt("ระบุหน่วยนับ (เช่น เตา, ชิ้น, หน่วย):") || "หน่วย";
            var initQty = parseInt(prompt("จำนวนเริ่มต้น:") || "0", 10);

            var items = getInventoryData();
            items.push({
                id: Date.now(),
                name: name.trim(),
                unit: unit.trim(),
                inQty: initQty,
                outQty: 0,
                total: initQty
            });

            localStorage.setItem("app_inventory_items", JSON.stringify(items));
            renderInventoryList();
            alert("เพิ่มรายการเรียบร้อย!");
        }

        // 2. ฟังก์ชันจัดการประวัติ Log จาก DroidScript
        function renderAppLogs(logString) {
            if (!logString || logString.trim() === "") return;

            // บันทึก Log สะสมลง LocalStorage
            localStorage.setItem("app_gps_logs", logString);
            displayLogsToTable(logString);
        }

        function displayLogsToTable(logString) {
            var logTableBody = document.getElementById("logTableBody");
            if (!logTableBody) return;

            logTableBody.innerHTML = "";

            var lines = logString.trim().split("\n");

            lines.forEach(function(line) {
                if (line.trim() === "") return;

                var cols = line.split(",");
                var tr = document.createElement("tr");
                tr.className = "hover:bg-gray-50 transition border-b border-gray-100";

                if (cols.length >= 4) {
                    tr.innerHTML = `
                        <td class="p-2.5 whitespace-nowrap text-gray-500">${cols[0] || '-'}</td>
                        <td class="p-2.5 font-semibold text-gray-800">${cols[1] || '-'}</td>
                        <td class="p-2.5">
                            <span class="bg-blue-100 text-blue-700 text-xs px-2 py-0.5 rounded-md font-medium">
                                ${cols[2] || 'บันทึก'}
                            </span>
                        </td>
                        <td class="p-2.5 text-center font-bold text-gray-700">${cols[3] || '1'}</td>
                        <td class="p-2.5 text-gray-600">${cols[4] || '-'}</td>
                    `;
                } else {
                    tr.innerHTML = `
                        <td colspan="5" class="p-2.5 text-gray-700 font-mono">${line}</td>
                    `;
                }

                logTableBody.appendChild(tr);
            });
        }

        // 3. ฟังก์ชันล้างประวัติ
        function clearAppLogs() {
            if (confirm("คุณต้องการล้างประวัติ Log ทั้งหมดใช่หรือไม่?")) {
                localStorage.removeItem("app_gps_logs");
                var logTableBody = document.getElementById("logTableBody");
                if (logTableBody) {
                    logTableBody.innerHTML = `
                        <tr id="noLogMsg">
                            <td colspan="5" class="p-6 text-center text-gray-400">
                                ยังไม่มีประวัติการทำรายการ
                            </td>
                        </tr>
                    `;
                }
            }
        }

        // 4. ฟังก์ชัน Export
        function exportLogs() {
            var savedLogs = localStorage.getItem("app_gps_logs");
            if(!savedLogs) {
                alert("ไม่มีข้อมูล Log สำหรับ Export");
                return;
            }
            var blob = new Blob([savedLogs], { type: "text/csv;charset=utf-8;" });
            var link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "GPS_Inventory_Logs.csv";
            link.click();
        }

        function openActionModal(type) {
            var actionName = type === 'in' ? 'รับเข้า' : 'เบิกออก';
            alert("เปิดหน้าทำรายการ: " + actionName);
        }
    </script>
</body>
</html>
