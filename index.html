<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบจัดการสต๊อกวัสดุ-อุปกรณ์ - มูลนิธิป่อเต็กตึ๊ง</title>
  
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- XLSX Library สำหรับ Export Excel -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    body { font-family: 'Prompt', sans-serif; }
    @media print {
      .no-print { display: none !important; }
      .print-only { display: block !important; }
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 pb-12">

  <!-- Header -->
  <header class="bg-red-700 text-white shadow-lg sticky top-0 z-40 no-print">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col sm:flex-row justify-between items-center gap-3">
      <div class="flex items-center space-x-3">
        <div class="bg-white p-2 rounded-lg text-red-700 shadow-md">
          <i class="fa-solid fa-boxes-stacked text-2xl"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold leading-tight">ระบบจัดการสต๊อกวัสดุ-อุปกรณ์</h1>
          <p class="text-xs text-red-200">มูลนิธิป่อเต็กตึ๊ง / คลังอุปกรณ์ประกอบอาหาร</p>
        </div>
      </div>
      
      <div class="flex items-center gap-2">
        <button onclick="openModal('in')" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs sm:text-sm px-3 py-2 rounded-lg font-medium shadow flex items-center gap-1.5 transition">
          <i class="fa-solid fa-plus-circle"></i> รับเข้า
        </button>
        <button onclick="openModal('out')" class="bg-amber-600 hover:bg-amber-700 text-white text-xs sm:text-sm px-3 py-2 rounded-lg font-medium shadow flex items-center gap-1.5 transition">
          <i class="fa-solid fa-minus-circle"></i> เบิกออก
        </button>
        <button onclick="exportToExcel()" class="bg-slate-800 hover:bg-slate-900 text-white text-xs sm:text-sm px-3 py-2 rounded-lg font-medium shadow flex items-center gap-1.5 transition">
          <i class="fa-solid fa-file-excel"></i> Export
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6">

    <!-- Dashboard Counter Cards -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6 no-print">
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
        <div>
          <p class="text-xs text-slate-500 font-medium">รายการทั้งหมด</p>
          <h3 id="stat-total" class="text-2xl font-bold text-slate-800">0</h3>
        </div>
        <div class="w-10 h-10 bg-slate-100 text-slate-600 rounded-lg flex items-center justify-center text-lg">
          <i class="fa-solid fa-list-check"></i>
        </div>
      </div>

      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
        <div>
          <p class="text-xs text-slate-500 font-medium">สต๊อกปกติ</p>
          <h3 id="stat-normal" class="text-2xl font-bold text-emerald-600">0</h3>
        </div>
        <div class="w-10 h-10 bg-emerald-50 text-emerald-600 rounded-lg flex items-center justify-center text-lg">
          <i class="fa-solid fa-circle-check"></i>
        </div>
      </div>

      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
        <div>
          <p class="text-xs text-slate-500 font-medium">ใกล้หมด (<= 3)</p>
          <h3 id="stat-low" class="text-2xl font-bold text-amber-500">0</h3>
        </div>
        <div class="w-10 h-10 bg-amber-50 text-amber-500 rounded-lg flex items-center justify-center text-lg">
          <i class="fa-solid fa-triangle-exclamation"></i>
        </div>
      </div>

      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
        <div>
          <p class="text-xs text-slate-500 font-medium">สินค้าหมด / ชำรุด</p>
          <h3 id="stat-out" class="text-2xl font-bold text-rose-600">0</h3>
        </div>
        <div class="w-10 h-10 bg-rose-50 text-rose-600 rounded-lg flex items-center justify-center text-lg">
          <i class="fa-solid fa-box-open"></i>
        </div>
      </div>
    </div>

    <!-- Filter & Search Bar -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-6 flex flex-col md:flex-row gap-3 justify-between items-center no-print">
      <div class="relative w-full md:w-80">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
        <input type="text" id="searchInput" oninput="renderTable()" placeholder="ค้นหาชื่ออุปกรณ์ / วัตถุดิบ..." 
               class="w-full pl-9 pr-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500 text-sm">
      </div>
      
      <div class="flex gap-2 w-full md:w-auto">
        <select id="statusFilter" onchange="renderTable()" class="w-full md:w-auto px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-red-500">
          <option value="all">แสดงทุกสถานะ</option>
          <option value="normal">พร้อมใช้งาน (> 3)</option>
          <option value="low">เหลือน้อย (1 - 3)</option>
          <option value="out">สินค้าหมด / ชำรุด (0)</option>
        </select>
        
        <button onclick="window.print()" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-sm font-medium border border-slate-300 flex items-center gap-1">
          <i class="fa-solid fa-print"></i> พิมพ์
        </button>
      </div>
    </div>

    <!-- Stock Table -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse text-sm">
          <thead>
            <tr class="bg-slate-100 text-slate-700 border-b border-slate-200 font-semibold">
              <th class="p-3 w-12 text-center">ลำดับ</th>
              <th class="p-3">ชื่อวัสดุ-อุปกรณ์</th>
              <th class="p-3 text-right">ที่มีอยู่เดิม</th>
              <th class="p-3 text-right text-emerald-700">รับเข้า</th>
              <th class="p-3 text-right text-amber-700">เบิกออก</th>
              <th class="p-3 text-right font-bold">คงเหลือ</th>
              <th class="p-3">วันที่ดำเนินการ</th>
              <th class="p-3">ผู้ดำเนินการ</th>
              <th class="p-3">หมายเหตุ</th>
            </tr>
          </thead>
          <tbody id="stockTableBody" class="divide-y divide-slate-100">
            <!-- Data will be populated here -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Modal Form (In / Out) -->
  <div id="actionModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4 no-print">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl relative">
      <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
        <i class="fa-solid fa-xmark text-xl"></i>
      </button>

      <h2 id="modalTitle" class="text-lg font-bold mb-4 flex items-center gap-2"></h2>

      <form id="stockForm" onsubmit="handleFormSubmit(event)">
        <input type="hidden" id="actionType">
        
        <div class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">เลือกรายการวัสดุ-อุปกรณ์</label>
            <select id="itemSelect" required class="w-full p-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-red-500">
              <!-- Render via JS -->
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">จำนวนที่ดำเนินการ</label>
            <input type="number" id="itemQty" min="1" required placeholder="กรอกจำนวน..." 
                   class="w-full p-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-red-500">
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">ผู้ดำเนินการ (ชื่อ / นามเรียกขาน)</label>
            <input type="text" id="operator" required placeholder="เช่น ธีรศักดิ์ (กู้ภัย 421) หรือ กู้ภัย 434" 
                   class="w-full p-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-red-500">
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">หมายเหตุ (ถ้ามี)</label>
            <input type="text" id="remark" placeholder="เช่น ใหม่ 2, เก่า 2 หรือ ชำรุด" 
                   class="w-full p-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-red-500">
          </div>
        </div>

        <div class="mt-6 flex justify-end gap-2">
          <button type="button" onclick="closeModal()" class="px-4 py-2 border border-slate-300 rounded-lg text-slate-600 text-sm font-medium hover:bg-slate-50">ยกเลิก</button>
          <button type="submit" id="submitBtn" class="px-4 py-2 text-white rounded-lg text-sm font-medium shadow"></button>
        </div>
      </form>
    </div>
  </div>

  <script>

      { id: 33, name: "ถังดำ(พลาสสติก)", exist: 1, in: 0, out: 0, balance: 1, unit: "ใบ", date: "-", operator: "-", remark: "" },

      { id: 35, name: "เครื่องบดเนื้อ ( เล็ก )", exist: 1, in: 0, out: 0, balance: 1, unit: "เครื่อง", date: "-", operator: "-", remark: "" },
      { id: 36, name: "ถังแก๊ส 48 kg (ใหญ่ )", exist: 1, in: 0, out: 0, balance: 1, unit: "ถัง", date: "-", operator: "-", remark: "" },
      { id: 37, name: "เตาเคลื่อนที่ ( ปป )", exist: 2, in: 0, out: 0, balance: 2, unit: "เตา", date: "-", operator: "-", remark: "" },
      { id: 38, name: "เทส", exist: 0, in: 0, out: 0, balance: 0, unit: "หน่วย", date: "-", operator: "-", remark: "" }
    ];

    function renderTable() {
      const tbody = document.getElementById('stockTableBody');
      const search = document.getElementById('searchInput').value.toLowerCase();
      const status = document.getElementById('statusFilter').value;

      tbody.innerHTML = '';
      
      let countTotal = 0, countNormal = 0, countLow = 0, countOut = 0;

      inventory.forEach(item => {
        countTotal++;
        if (item.balance === 0) countOut++;
        else if (item.balance <= 3) countLow++;
        else countNormal++;

        // Filter Conditions
        const matchesSearch = item.name.toLowerCase().includes(search) || item.remark.toLowerCase().includes(search);
        let matchesStatus = true;
        if (status === 'normal') matchesStatus = item.balance > 3;
        if (status === 'low') matchesStatus = item.balance > 0 && item.balance <= 3;
        if (status === 'out') matchesStatus = item.balance === 0;

        if (matchesSearch && matchesStatus) {
          let badgeStyle = "bg-emerald-100 text-emerald-800 border-emerald-200";
          if (item.balance === 0) badgeStyle = "bg-rose-100 text-rose-800 border-rose-200 font-bold";
          else if (item.balance <= 3) badgeStyle = "bg-amber-100 text-amber-800 border-amber-200 font-bold";

          const row = `
            <tr class="hover:bg-slate-50 transition border-b border-slate-100">
              <td class="p-3 text-center text-slate-400 font-medium">${item.id}</td>
              <td class="p-3 font-semibold text-slate-800">${item.name}</td>
              <td class="p-3 text-right text-slate-500">${item.exist ? item.exist.toLocaleString() : '-'}</td>
              <td class="p-3 text-right text-emerald-600 font-medium">${item.in ? '+' + item.in.toLocaleString() : '-'}</td>
              <td class="p-3 text-right text-amber-600 font-medium">${item.out ? '-' + item.out.toLocaleString() : '-'}</td>
              <td class="p-3 text-right">
                <span class="inline-block px-2.5 py-0.5 rounded-full text-xs border ${badgeStyle}">
                  ${item.balance.toLocaleString()} ${item.unit}
                </span>
              </td>
              <td class="p-3 text-slate-500 text-xs">${item.date}</td>
              <td class="p-3 text-slate-700 font-medium text-xs">${item.operator}</td>
              <td class="p-3 text-slate-500 text-xs">${item.remark || '-'}</td>
            </tr>
          `;
          tbody.innerHTML += row;
        }
      });

      // Update Dashboard Numbers
      document.getElementById('stat-total').innerText = countTotal;
      document.getElementById('stat-normal').innerText = countNormal;
      document.getElementById('stat-low').innerText = countLow;
      document.getElementById('stat-out').innerText = countOut;
    }

    function openModal(type) {
      const modal = document.getElementById('actionModal');
      const title = document.getElementById('modalTitle');
      const submitBtn = document.getElementById('submitBtn');
      const actionType = document.getElementById('actionType');
      const select = document.getElementById('itemSelect');

      actionType.value = type;
      select.innerHTML = '<option value="">-- เลือกรายการอุปกรณ์ --</option>';
      inventory.forEach(item => {
        select.innerHTML += `<option value="${item.id}">${item.name} (คงเหลือ: ${item.balance} ${item.unit})</option>`;
      });

      if (type === 'in') {
        title.innerHTML = `<i class="fa-solid fa-plus-circle text-emerald-600"></i> บันทึกรับสินค้าเข้าสต๊อก`;
        submitBtn.innerText = "บันทึกการรับเข้า";
        submitBtn.className = "px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-sm font-medium shadow";
      } else {
        title.innerHTML = `<i class="fa-solid fa-minus-circle text-amber-600"></i> บันทึกการเบิกสินค้าออก`;
        submitBtn.innerText = "บันทึกการเบิกออก";
        submitBtn.className = "px-4 py-2 bg-amber-600 hover:bg-amber-700 text-white rounded-lg text-sm font-medium shadow";
      }

      modal.classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('actionModal').classList.add('hidden');
      document.getElementById('stockForm').reset();
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      const id = parseInt(document.getElementById('itemSelect').value);
      const qty = parseInt(document.getElementById('itemQty').value);
      const operator = document.getElementById('operator').value.trim();
      const remark = document.getElementById('remark').value.trim();
      const type = document.getElementById('actionType').value;

      const item = inventory.find(i => i.id === id);
      if (!item) return;

      if (type === 'out' && qty > item.balance) {
        alert(`❌ ไม่สามารถเบิกออกได้! จำนวนที่เบิก (${qty}) มากกว่าคงเหลือในสต๊อก (${item.balance})`);
        return;
      }

      // Format Date: DD/MM/YYYY (พ.ศ.)
      const now = new Date();
      const thaiYear = now.getFullYear() + 543;
      const dateStr = `${String(now.getDate()).padStart(2, '0')}/${String(now.getMonth() + 1).padStart(2, '0')}/${thaiYear}`;

      if (type === 'in') {
        item.in = (item.in || 0) + qty;
        item.balance += qty;
      } else {
        item.out = (item.out || 0) + qty;
        item.balance -= qty;
      }

      item.date = dateStr;
      item.operator = operator;
      if (remark) item.remark = remark;
      
      // บันทึกข้อมูลลง LocalStorage
      localStorage.setItem('inventory', JSON.stringify(inventory));

      renderTable();
      closeModal();
    }

    function exportToExcel() {
      const exportData = inventory.map(item => ({
        'ลำดับ': item.id,
        'ชื่อวัสดุ-อุปกรณ์': item.name,
        'ที่มีอยู่เดิม': item.exist,
        'รับเข้า': item.in || 0,
        'เบิกออก': item.out || 0,
        'คงเหลือ': item.balance,
        'หน่วย': item.unit,
        'วันที่ดำเนินการ': item.date,
        'ผู้ดำเนินการ': item.operator,
        'หมายเหตุ': item.remark
      }));

      const worksheet = XLSX.utils.json_to_sheet(exportData);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "Stock_ Report");
      XLSX.writeFile(workbook, `รายงานสต๊อก_กู้ภัย_${new Date().toISOString().slice(0,10)}.xlsx`);
    }

    // Initialize
    document.addEventListener('DOMContentLoaded', renderTable);
  </script>
</body>
  </html>
